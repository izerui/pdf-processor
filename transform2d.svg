<svg viewBox="-50 -50 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- rotation around point with coordinates (0, 0) is shown in fig.a -->
    <!-- 通过 transform="matrix(1, 0, 0, 1, 0, 0)" 进行控制变换矩阵 -->
    <g>
        <line x1="0" y1="0" x2="0" y2="100" style="stroke:rgb(8, 112, 177);"/>
        <line x1="0" y1="0" x2="0" y2="-100" style="stroke:rgb(8, 112, 177);"/>
        <line x1="0" y1="0" x2="-100" y2="0" style="stroke:rgb(8, 112, 177);"/>
        <line x1="0" y1="0" x2="100" y2="0" style="stroke:rgb(8, 112, 177);"/>
        <!-- 尝试改变变换矩阵的`transform`值获取新的图像 -->
        <!--
            # a: x方向缩放(宽度)。例如，如果值为0.5，则将宽度缩小2倍。如果a < 0，将(额外地)发生左右翻转。
            # b: 产生剪切效果: 每个点(x, y)将变成点(x, y - b * x)。因此，水平线会“倾斜”。
            # c: 产生剪切效果: 每个点(x, y)都会变成点(x - c * y, y)，因此垂直线会“倾斜”。
            # d: y方向缩放(高度)。例如，如果值为1.5，则将高度拉伸50 %。如果d < 0，将(额外地)发生上下翻转。
            # e: 产生水平偏移效果: 每个Point(x, y)都会变成Point(x + e, y)， e的正(负)值会向右(左)偏移。
            # f: 产生垂直位移效应: 每个Point(x, y)都会变成Point(x, y - f)， f的正(负)值会向下(上)移动。
            得出结论：
            如果d小于0，例如-2: 则图像沿x轴向上翻转，并高度拉伸倍数为2
            如果a小于0，例如-2: 则图像沿y轴向左翻转，并长度拉伸倍数为2
         -->
        <rect x="0" y="0" width="60" height="30" fill="red"
              transform="matrix(1, 0, 0, -1, 0, 0)"/>
    </g>
</svg>